<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Background Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body>
    <canvas id="background-canvas"></canvas>

    <script type="module">
        import AnimatedBackground from './src/animated-background.js';

        document.addEventListener('DOMContentLoaded', function() {
            const background = new AnimatedBackground('background-canvas');
        });
    </script>
</body>
</html>
